schema_version: 1

context:
  version: "0.35.2"

package:
  name: pandas-gbq
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pandas-gbq/pandas_gbq-${{ version }}.tar.gz
  sha256: 3613f203e0ad9cbe38709fcb9b4c2c9af1fdb46bed333219b34a639142850806

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - setuptools
    - db-dtypes >=1.1.1,<2.0.0
    - numpy >=1.26.4
    - pandas >=1.5.3
    # use the higher constraint for py3.14
    - pyarrow >=22.0.0
    - pydata-google-auth >=1.5.0
    - psutil >=5.9.8
    - google-api-core >=2.25.0,<3.0.0
    - google-auth >=2.14.1
    - google-auth-oauthlib >=0.7.0
    - google-cloud-bigquery-core >=3.20.0,<4.0.0
    - packaging >=22.0.0
    # "bqstorage" extra
    - google-cloud-bigquery-storage >=2.29.0,<3.0.0
  run_constraints:
    # "tqdm" extra
    - tqdm >=4.23.0
    # "geopandas" extra
    - geopandas >=0.14.4
    - shapely >=1.8.5

tests:
  - python:
      imports:
        - pandas_gbq
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pytest
        - pytest-xdist
        - freezegun
        - geopandas
    files:
      source:
        - tests/
    script:
      - pytest -vv -nauto tests/unit

about:
  summary: Google BigQuery connector for pandas
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/pandas-gbq
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/pandas-gbq
  documentation: https://googleapis.dev/python/pandas-gbq/latest/index.html

extra:
  recipe-maintainers:
    - chalmerlowe
    - jreback
    - leahecole
    - parthea
    - tswast
    - mgorny
